<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06111e">
  <title>BlockCase — кейсы в Minecraft</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game-shell">
  <aside class="rail" aria-label="Главное меню">
    <button data-screen="lobby" class="active"><i>⌂</i><span>Играть</span></button>
    <button data-screen="cases"><i>▣</i><span>Кейсы</span></button>
    <button data-screen="inventory"><i>⚔</i><span>Инвентарь</span></button>
    <button data-screen="shop"><i>🏪</i><span>Магазин</span></button>
    <button data-screen="bonuses"><i>♟</i><span>Бонусы</span></button>
    <button data-screen="leaders"><i>♛</i><span>Лидеры</span></button>
    <button data-screen="settings" class="settings"><i>⚙</i><span>Настройки</span></button>
    <button data-screen="chat" class="chat-fab" aria-label="Чат"><i>☁</i></button>
  </aside>

  <aside class="left-panel">
    <div class="profile panel">
      <div class="avatar">😛</div>
      <div><strong>Player775587</strong><small>УРОВЕНЬ 12</small><div class="xp"><span></span></div><em>850 / 1500</em></div>
    </div>
    <div class="mini-wallet panel">
      <span>🪙 <b data-coins></b></span><button data-buy="coins">+</button>
      <span>💚 <b data-gems></b></span><button data-buy="gems">+</button>
    </div>
    <div class="activity panel">
      <div class="feed"><i>😍</i><p><b>Player9007</b><span>открыл кейс «Алмазы»</span><small>10 мин назад</small></p></div>
      <div class="feed"><i>🧙</i><p><b>Player2011</b><span>получил нож «Радуга»</span><small>25 мин назад</small></p></div>
      <div class="feed"><i>🧟</i><p><b>Player713</b><span>прокачал уровень до 15</span><small>1 ч назад</small></p></div>
      <div class="feed"><i>🐷</i><p><b>EVA_POKER</b><span>открыла кейс «Золото»</span><small>2 ч назад</small></p></div>
      <button data-screen="chat">💬 ОТКРЫТЬ ЧАТ</button>
    </div>
  </aside>

  <section class="world">
    <canvas id="world3d" aria-label="Интерактивное 3D-лобби Minecraft"></canvas>
    <div class="sun"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
    <div class="island island-a"><span></span></div><div class="island island-b"><span></span></div>
    <div class="tree"><div class="crown"><i></i><i></i><i></i></div><div class="trunk"></div></div>
    <div class="chest"><div class="lid"></div><div class="chest-lock"></div></div>
    <div class="torch"><div class="flame"></div><div class="stick"></div></div>
    <div class="ores"><div></div><div></div><div></div></div>
    <div class="embers" id="embers"></div><div class="grass-plane"></div>

    <div class="hero" id="hero">
      <div class="nameplate">Player775587</div>
      <div class="character-wrap" id="characterDrag" aria-label="Персонаж. Потяните влево или вправо">
        <div class="character" id="character">
          <div class="cube head3"><span class="front face"></span><span class="back face"></span><span class="left face"></span><span class="right face"></span><span class="top face"></span></div>
          <div class="cube torso"><span class="front face"></span><span class="back face"></span><span class="left face"></span><span class="right face"></span></div>
          <div class="cube arm3 arm-l"><span class="front face"></span><span class="side face"></span></div>
          <div class="cube arm3 arm-r"><span class="front face"></span><span class="side face"></span></div>
          <div class="cube leg3 leg-l"><span class="front face"></span><span class="side face"></span></div>
          <div class="cube leg3 leg-r"><span class="front face"></span><span class="side face"></span></div>
        </div>
      </div>
      <div class="rotate-note">↔ ПОВЕРНИ ИГРОКА</div>
      <div class="pedestal"><span>🏆 1560</span></div>
    </div>
    <div id="screen" class="screen panel" hidden></div>
  </section>

  <aside class="right-panel">
    <div class="top-wallet panel">
      <span>💚 <b data-gems></b></span><button data-buy="gems">+</button>
      <span>🪙 <b data-coins></b>.00</span><button data-buy="coins">+</button>
    </div>
    <button class="featured panel" data-screen="cases"><div class="case-cube">💎</div><div><b>АЛМАЗНЫЙ КЕЙС</b><span>ОТКРОЙ И ПОЛУЧИ<br>ЛУЧШИЕ НАГРАДЫ!</span></div></button>
    <div class="daily panel"><h3>ЕЖЕДНЕВНЫЕ БОНУСЫ</h3><div id="dailyMini"></div></div>
    <button class="leaders-card panel" data-screen="leaders"><i>🏆</i><span><b>ТОП ИГРОКИ</b><small>СМОТРИ ЛИДЕРОВ</small></span><em>›</em></button>
    <button class="play" data-screen="cases">ИГРАТЬ</button>
  </aside>
  <div class="toast" id="toast"></div>
</main>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="world3d.js"></script>
<script src="app.js"></script>
</body>
</html>
